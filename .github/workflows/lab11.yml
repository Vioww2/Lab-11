name: Lab 11 Monitoring and Logging
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Deploy and verify lab
        run: |
          cat > compose.yml <<'LAB11_EOF'
          services:
            node:
              image: prom/node-exporter:v1.9.1
              pid: host
              volumes: ["/:/host:ro,rslave"]
              command: ["--path.rootfs=/host"]
            prometheus:
              image: prom/prometheus:v3.5.0
              ports: ["127.0.0.1:9090:9090"]
              volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
            grafana:
              image: grafana/grafana:12.1.0
              ports: ["127.0.0.1:3000:3000"]
            elasticsearch:
              image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
              ports: ["127.0.0.1:9200:9200"]
              environment:
                discovery.type: single-node
                xpack.security.enabled: "false"
                ES_JAVA_OPTS: "-Xms512m -Xmx512m"
            kibana:
              image: docker.elastic.co/kibana/kibana:8.10.2
              ports: ["127.0.0.1:5601:5601"]
              environment:
                ELASTICSEARCH_HOSTS: http://elasticsearch:9200
              depends_on: [elasticsearch]
            logstash:
              image: docker.elastic.co/logstash/logstash:8.10.2
              environment:
                XPACK_MONITORING_ENABLED: "false"
                LS_JAVA_OPTS: "-Xms256m -Xmx256m"
              volumes:
                - ./pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
                - ./app.log:/logs/app.log:ro
              depends_on: [elasticsearch]
          LAB11_EOF
          cat > prometheus.yml <<'LAB11_EOF'
          global:
            scrape_interval: 5s
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["localhost:9090"]
            - job_name: node_exporter
              static_configs:
                - targets: ["node:9100"]
          LAB11_EOF
          cat > pipeline.conf <<'LAB11_EOF'
          input {
            file {
              path => "/logs/app.log"
              start_position => "beginning"
              sincedb_path => "/usr/share/logstash/data/lab11.sincedb"
              codec => json
            }
          }
          output {
            elasticsearch {
              hosts => ["http://elasticsearch:9200"]
              index => "lab11-events"
              ilm_enabled => false
              data_stream => false
            }
          }
          LAB11_EOF
          cat > app.log <<'LAB11_EOF'
          {"level":"INFO","message":"Worker started"}
          {"level":"INFO","message":"Batch accepted"}
          {"level":"WARN","message":"Batch latency over 500 ms"}
          {"level":"ERROR","message":"Batch timed out"}
          {"level":"INFO","message":"Worker recovered"}
          LAB11_EOF
          cat > lab.py <<'LAB11_EOF'
          import base64
          import json
          import os
          import time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from docx import Document
          from docx.shared import Pt
          
          def api(url, body=None, headers=None, method=None):
              req = Request(url, data=None if body is None else json.dumps(body).encode(),
                            headers={"Content-Type":"application/json", **(headers or {})}, method=method)
              with urlopen(req, timeout=20) as response:
                  return json.load(response)
          
          def wait(call, ready, name):
              for _ in range(90):
                  try:
                      result = call()
                      if ready(result):
                          return result
                  except (OSError, ValueError) as error:
                      print(f"{name}: {error}", flush=True)
                  time.sleep(5)
              raise RuntimeError(f"Not ready: {name}")
          
          p = "http://127.0.0.1:9090"
          g = "http://127.0.0.1:3000"
          e = "http://127.0.0.1:9200"
          k = "http://127.0.0.1:5601"
          ga = {"Authorization": "Basic " + base64.b64encode(b"admin:admin").decode()}
          ka = {"kbn-xsrf":"lab11"}
          def query(expr, host=p, headers=None):
              return api(host + "/api/v1/query?" + urlencode({"query":expr}), headers=headers)["data"]["result"]
          up = wait(lambda: query("up"), lambda v: len(v)==2 and all(x["value"][1]=="1" for x in v), "Prometheus targets")
          cpu_expr = '100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])))'
          mem_expr = '100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)'
          cpu = float(wait(lambda: query(cpu_expr), bool, "CPU")[0]["value"][1])
          ram = float(query(mem_expr)[0]["value"][1])
          available = int(query("node_memory_MemAvailable_bytes")[0]["value"][1])
          wait(lambda: api(g+"/api/health"), lambda d: d["database"]=="ok", "Grafana")
          api(g+"/api/datasources", {"name":"Prometheus","uid":"lab-prom","type":"prometheus",
              "url":"http://prometheus:9090","access":"proxy","isDefault":True}, ga)
          dash = api("https://grafana.com/api/dashboards/1860/revisions/latest/download")
          dash["id"] = None
          saved = api(g+"/api/dashboards/db", {"dashboard":dash,"overwrite":True}, ga)
          assert saved["status"] == "success", saved
          health = api(g+"/api/datasources/uid/lab-prom/health", headers=ga)
          assert health["status"] == "OK", health
          gp = g+"/api/datasources/proxy/uid/lab-prom"
          assert query(mem_expr, gp, ga)
          hits = wait(lambda: api(e+"/lab11-events/_search?size=20"), 
                      lambda d: d["hits"]["total"]["value"]>=5, "Logstash indexing")
          events = [x["_source"] for x in hits["hits"]["hits"]]
          expected = sorted((x["level"],x["message"]) for x in map(json.loads, Path("app.log").read_text().splitlines()))
          assert sorted((x["level"],x["message"]) for x in events) == expected
          errors = api(e+"/lab11-events/_count", {"query":{"term":{"level.keyword":"ERROR"}}})
          assert errors["count"] == 1, errors
          wait(lambda: api(k+"/api/status"), lambda d:d["status"]["overall"]["level"]=="available", "Kibana")
          view = api(k+"/api/data_views/data_view",{"data_view":{"id":"lab11-events","title":"lab11-events",
              "name":"Lab 11 Events","timeFieldName":"@timestamp"}},ka)
          assert view["data_view"]["title"] == "lab11-events"
          via_kibana = api(k+"/api/console/proxy?path=lab11-events%2F_search&method=GET",headers=ka,method="POST")
          assert via_kibana["hits"]["total"]["value"] == 5
          out = Path("results")
          out.mkdir(exist_ok=True)
          run = os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          proof = {"run":run,"runner":os.environ["RUNNER_OS"],"targets":up,"cpu_percent":cpu,
                   "ram_percent":ram,"available_bytes":available,"grafana":saved,"grafana_data_source":health,
                   "kibana_data_view":view["data_view"]["title"],"kibana_hits":5,"errors":errors["count"],
                   "events":[{key:x[key] for key in ("@timestamp","level","message")} for x in events]}
          (out/"evidence.json").write_text(json.dumps(proof,indent=2),encoding="utf-8")
          d=Document()
          for name in ("Normal","Title","Heading 1"):
              d.styles[name].font.name="Calibri"
          d.styles["Normal"].font.size=Pt(11)
          from docx.oxml.ns import qn
          for b in d.styles["Title"]._element.xpath("./w:pPr/w:pBdr"):
              b.getparent().remove(b)
          d.add_paragraph("Лабораторная работа 11", "Title")
          d.add_paragraph("Мониторинг и логирование в GitHub Actions")
          d.add_paragraph("Дисциплина — DevOps и операционные системы")
          d.add_paragraph("Выполнил(а) _______________________    Группа __________")
          d.add_paragraph("Запуск и журнал проверки\n"+run)
          d.add_heading("Цель работы",1)
          d.add_paragraph("Настроить сбор метрик Linux и централизованный поиск журналов. Все шесть сервисов запущены через Docker Compose на облачном Ubuntu-раннере GitHub Actions.")
          d.add_heading("Задание 1 Сбор метрик Prometheus",1)
          d.add_paragraph("Prometheus опрашивал себя и Node Exporter каждые пять секунд. Запрос up вернул значение 1 для обеих целей. Node Exporter измерял ресурсы облачной машины.")
          t=d.add_table(rows=1,cols=2)
          t.style="Light Shading Accent 1"
          for cell,value in zip(t.rows[0].cells,("Показатель","Результат")):
              cell.text=value
          for a,b in [("Загрузка CPU за минуту",f"{cpu:.2f} %"),("Использование RAM",f"{ram:.2f} %"),
                      ("Доступная память",f"{available/2**30:.2f} ГиБ")]:
              row=t.add_row()
              row.cells[0].text=a
              row.cells[1].text=b.replace(".",",")
          d.add_heading("Задание 2 Дашборд Grafana",1)
          d.add_paragraph("Настроен источник Prometheus с адресом http://prometheus:9090 и импортирован Node Exporter Full (ID 1860). Проверка источника через API вернула OK. Запрос доли используемой памяти через Grafana вернул данные.")
          d.add_paragraph("PromQL для CPU\n"+cpu_expr)
          d.add_paragraph("PromQL для RAM\n"+mem_expr)
          d.add_page_break()
          d.add_heading("Задание 3 Централизованный поиск журналов",1)
          d.add_paragraph("Файл app.log содержал пять синтетических событий обработки пакета. Logstash прочитал JSON-строки, добавил временные метки и записал события в индекс lab11-events. Kibana использовала одноимённое представление данных с полем @timestamp.")
          t=d.add_table(rows=1,cols=3)
          t.style="Light Shading Accent 1"
          for cell,value in zip(t.rows[0].cells,("Время UTC","Уровень","Сообщение")):
              cell.text=value
          for event in proof["events"]:
              row=t.add_row()
              for cell,value in zip(row.cells,(event["@timestamp"][:23],event["level"],event["message"])):
                  cell.text=value
          d.add_paragraph("Поиск через API Kibana вернул все пять событий. Фильтр по level.keyword = ERROR в Elasticsearch нашёл одну запись — Batch timed out.")
          d.add_heading("Вывод",1)
          d.add_paragraph("Prometheus подтвердил доступность обеих целей, а Grafana получила метрику памяти через настроенный источник. Цепочка Logstash, Elasticsearch и Kibana обработала и вернула весь набор тестовых событий.")
          d.core_properties.title="Лабораторная работа 11"
          d.core_properties.author=""
          d.save(out/"Lab-11.docx")
          print(json.dumps(proof,indent=2),flush=True)
          LAB11_EOF
          sudo sysctl -w vm.max_map_count=262144
          python -m pip install python-docx pillow pdf2image
          docker compose up -d
          python lab.py
      - name: Render Word report
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation
          libreoffice -env:UserInstallation=file:///tmp/lab11-lo --headless --convert-to pdf --outdir results results/Lab-11.docx
          pdftoppm -r 125 -png results/Lab-11.pdf results/page
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p results
          docker compose ps -a > results/containers.txt
          docker compose logs --no-color > results/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab11-results
          path: results/
